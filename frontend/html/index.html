<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CWMS — Login</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .auth-features { display: flex; gap: 20px; margin-top: 28px; }
        .feature { flex: 1; text-align: center; }
        .feature .f-icon { font-size: 22px; margin-bottom: 6px; }
        .feature p { font-size: 11px; color: var(--text-muted); }
        .divider { text-align: center; color: var(--text-muted); font-size: 12px; margin: 16px 0; position: relative; }
        .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: var(--border); }
        .divider::before { left: 0; } .divider::after { right: 0; }
        .input-icon-wrap { position: relative; }
        .input-icon-wrap .icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--text-muted); }
        .input-icon-wrap .form-control { padding-left: 40px; }
        .forgot { font-size: 13px; color: var(--primary); text-decoration: none; float: right; margin-top: -12px; margin-bottom: 16px; display: block; }
    </style>
</head>
<body class="auth-body">
<div class="auth-card">
    <div class="auth-logo">
        <div class="logo-icon">🛡️</div>
        <h1>CWMS</h1>
        <p>Child Welfare Management System</p>
    </div>

    <div id="alert-box"></div>

    <div class="form-group">
        <label>Username</label>
        <div class="input-icon-wrap">
            <span class="icon">👤</span>
            <input type="text" id="username" class="form-control" placeholder="Enter your username" value="admin">
        </div>
    </div>
    <div class="form-group">
        <label>Password</label>
        <div class="input-icon-wrap">
            <span class="icon">🔒</span>
            <input type="password" id="password" class="form-control" placeholder="Enter your password" value="admin123">
        </div>
    </div>
    <a href="#" class="forgot">Forgot password?</a>

    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;" onclick="login()">
        Sign In →
    </button>

    <div class="divider">System Features</div>

    <div class="auth-features">
        <div class="feature"><div class="f-icon">👶</div><p>Child Registry</p></div>
        <div class="feature"><div class="f-icon">🏥</div><p>Health Tracking</p></div>
        <div class="feature"><div class="f-icon">📚</div><p>Education</p></div>
        <div class="feature"><div class="f-icon">🔔</div><p>Alerts</p></div>
    </div>
</div>

<script>
async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const box = document.getElementById('alert-box');
    const btn = document.querySelector('button');

    if (!username || !password) {
        box.innerHTML = '<div class="alert alert-danger">⚠️ Please enter username and password.</div>';
        return;
    }

    btn.textContent = 'Signing in...';
    btn.disabled = true;

    try {
        const res = await fetch('http://localhost:3000/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
            box.innerHTML = `<div class="alert alert-danger">❌ ${data.error}</div>`;
            btn.textContent = 'Sign In →';
            btn.disabled = false;
            return;
        }

        localStorage.setItem('cwms_token', data.token);
        localStorage.setItem('cwms_user', JSON.stringify(data.user));
        box.innerHTML = '<div class="alert alert-success">✅ Login successful! Redirecting...</div>';
        setTimeout(() => window.location.href = 'dashboard.html', 800);
    } catch (e) {
        box.innerHTML = '<div class="alert alert-danger">❌ Cannot connect to server. Is it running?</div>';
        btn.textContent = 'Sign In →';
        btn.disabled = false;
    }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
