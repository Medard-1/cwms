<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — CWMS</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .msg-tabs { display:flex; gap:4px; background:var(--body-bg); padding:4px; border-radius:12px; width:fit-content; margin-bottom:24px; }
        .msg-tab { padding:9px 22px; border-radius:9px; border:none; background:transparent; font-size:14px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; color:var(--text-muted); transition:var(--transition); }
        .msg-tab.active { background:white; color:var(--primary); box-shadow:0 2px 8px rgba(0,0,0,0.08); font-weight:600; }
        .msg-tab-panel { display:none; } .msg-tab-panel.active { display:block; }
        .msg-row { display:flex; align-items:flex-start; gap:14px; padding:16px; border-bottom:1px solid var(--border); cursor:pointer; transition:var(--transition); }
        .msg-row:hover { background:#f8fafc; }
        .msg-row.unread { background:#f0f4ff; }
        .msg-row.unread .msg-subject { font-weight:700; }
        .msg-avatar { width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg,var(--primary),var(--secondary)); display:flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:15px; flex-shrink:0; }
        .msg-subject { font-size:14px; font-weight:500; color:var(--dark); margin-bottom:4px; }
        .msg-preview { font-size:13px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:400px; }
        .msg-meta { font-size:12px; color:var(--text-muted); white-space:nowrap; margin-left:auto; text-align:right; }
        .msg-body-text { font-size:15px; line-height:1.7; color:var(--text); white-space:pre-wrap; }
        .compose-fab { position:fixed; bottom:32px; right:32px; width:56px; height:56px; border-radius:16px; background:var(--primary); color:white; border:none; font-size:24px; cursor:pointer; box-shadow:0 8px 24px rgba(99,102,241,0.4); transition:var(--transition); display:flex; align-items:center; justify-content:center; }
        .compose-fab:hover { background:var(--primary-dark); transform:translateY(-2px); }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">🛡️</div>
            <div class="brand-text"><h2>CWMS</h2><span>Welfare System</span></div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Main</div>
            <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
            <a href="register.html" class="nav-item"><span class="nav-icon">👶</span> Children</a>
            <a href="health.html" class="nav-item"><span class="nav-icon">🏥</span> Health Records</a>
            <a href="education.html" class="nav-item"><span class="nav-icon">📚</span> Education</a>
            <div class="nav-section-title">Management</div>
            <a href="report.html" class="nav-item"><span class="nav-icon">📋</span> Cases & Reports</a>
            <a href="abuse-report.html" class="nav-item"><span class="nav-icon">🚨</span> Report Abuse</a>
            <a href="messages.html" class="nav-item active"><span class="nav-icon">💬</span> Messages <span class="badge" id="unread-badge" style="position:relative;top:0;right:0;margin-left:6px;display:none;">0</span></a>
            <div id="users-nav-section" style="display:none">
                <div class="nav-section-title">System</div>
                <a href="users.html" class="nav-item"><span class="nav-icon">👥</span> Users</a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <a href="index.html" class="nav-item" onclick="logout()"><span class="nav-icon">🚪</span> Logout</a>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <div class="topbar-left">
                <h1>Messages</h1>
                <p>Internal communication between staff</p>
            </div>
            <div class="topbar-right">
                <button class="btn btn-primary" onclick="openCompose()">✉️ Compose</button>
                <div class="avatar" id="topbar-avatar">A</div>
            </div>
        </div>

        <div class="content">
            <div class="msg-tabs">
                <button class="msg-tab active" onclick="switchTab('inbox', this)">📥 Inbox <span id="inbox-count"></span></button>
                <button class="msg-tab" onclick="switchTab('sent', this)">📤 Sent</button>
            </div>

            <!-- INBOX -->
            <div class="msg-tab-panel active" id="tab-inbox">
                <div class="card">
                    <div class="card-header"><h3>Inbox</h3></div>
                    <div id="inbox-list"><div class="empty-state"><div class="empty-icon">⏳</div><p>Loading...</p></div></div>
                </div>
            </div>

            <!-- SENT -->
            <div class="msg-tab-panel" id="tab-sent">
                <div class="card">
                    <div class="card-header"><h3>Sent Messages</h3></div>
                    <div id="sent-list"><div class="empty-state"><div class="empty-icon">⏳</div><p>Loading...</p></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Compose Modal -->
<div class="modal-overlay" id="compose-modal">
    <div class="modal">
        <div class="modal-header">
            <h3>✉️ New Message</h3>
            <button class="modal-close" onclick="closeCompose()">✕</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>To *</label>
                <select id="msg-to" class="form-control"><option value="">Select recipient...</option></select>
            </div>
            <div class="form-group">
                <label>Subject *</label>
                <input type="text" id="msg-subject" class="form-control" placeholder="Message subject">
            </div>
            <div class="form-group">
                <label>Message *</label>
                <textarea id="msg-body" class="form-control" rows="5" placeholder="Write your message..."></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeCompose()">Cancel</button>
            <button class="btn btn-primary" onclick="sendMessage()">📤 Send Message</button>
        </div>
    </div>
</div>

<!-- Read Message Modal -->
<div class="modal-overlay" id="read-modal">
    <div class="modal" style="width:600px;">
        <div class="modal-header">
            <h3 id="read-subject">—</h3>
            <button class="modal-close" onclick="closeRead()">✕</button>
        </div>
        <div class="modal-body">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);">
                <div class="msg-avatar" id="read-avatar">?</div>
                <div>
                    <div style="font-weight:600;" id="read-from">—</div>
                    <div style="font-size:13px;color:var(--text-muted);" id="read-date">—</div>
                </div>
                <button class="btn btn-outline btn-sm" style="margin-left:auto;" onclick="replyTo()" id="reply-btn">↩️ Reply</button>
            </div>
            <div class="msg-body-text" id="read-body">—</div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-danger btn-sm" onclick="deleteCurrentMsg()">🗑️ Delete</button>
            <button class="btn btn-outline" onclick="closeRead()">Close</button>
        </div>
    </div>
</div>

<!-- Compose FAB -->
<button class="compose-fab" onclick="openCompose()" title="Compose">✉️</button>

<div id="toast-container"></div>

<script>
const API = 'http://localhost:3000/api';
let currentUser = null, allUsers = [], currentMsgId = null, currentSenderId = null;

function authHeaders() {
    return {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('cwms_token')};
}

async function init() {
    currentUser = JSON.parse(localStorage.getItem('cwms_user') || 'null');
    if (!currentUser) { window.location.href = 'index.html'; return; }

    document.getElementById('topbar-avatar').textContent = currentUser.full_name[0].toUpperCase();
    if (currentUser.role === 'admin') document.getElementById('users-nav-section').style.display = 'block';

    allUsers = await fetch(`${API}/auth/users`, {headers: authHeaders()}).then(r => r.json());

    // Populate recipient dropdown (exclude self)
    document.getElementById('msg-to').innerHTML =
        '<option value="">Select recipient...</option>' +
        allUsers.filter(u => u.id !== currentUser.id)
               .map(u => `<option value="${u.id}">${u.full_name} (${u.role})</option>`).join('');

    await loadMessages();
}

async function loadMessages() {
    const [inbox, sent, unread] = await Promise.all([
        fetch(`${API}/messages/inbox/${currentUser.id}`, {headers: authHeaders()}).then(r => r.json()),
        fetch(`${API}/messages/sent/${currentUser.id}`, {headers: authHeaders()}).then(r => r.json()),
        fetch(`${API}/messages/unread-count/${currentUser.id}`, {headers: authHeaders()}).then(r => r.json()),
    ]);

    const unreadCount = Number(unread.count);
    const badge = document.getElementById('unread-badge');
    const inboxCount = document.getElementById('inbox-count');
    if (unreadCount > 0) {
        badge.textContent = unreadCount;
        badge.style.display = 'inline-flex';
        inboxCount.innerHTML = `<span class="badge" style="position:relative;top:0;right:0;margin-left:6px;">${unreadCount}</span>`;
    } else {
        badge.style.display = 'none';
        inboxCount.innerHTML = '';
    }

    renderInbox(inbox);
    renderSent(sent);
}

function renderInbox(data) {
    const el = document.getElementById('inbox-list');
    if (!data.length) {
        el.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><h3>No messages</h3><p>Your inbox is empty</p></div>';
        return;
    }
    el.innerHTML = data.map(m => `
        <div class="msg-row ${!m.is_read ? 'unread' : ''}" onclick="readMessage(${m.id}, '${escHtml(m.subject)}', '${escHtml(m.sender_name)}', '${escHtml(m.body)}', '${m.created_at}', ${m.sender_id}, ${m.is_read})">
            <div class="msg-avatar">${m.sender_name[0].toUpperCase()}</div>
            <div style="flex:1;min-width:0;">
                <div style="display:flex;align-items:center;gap:8px;">
                    <span style="font-weight:600;font-size:14px;">${m.sender_name}</span>
                    <span class="pill pill-gray" style="font-size:11px;">${m.sender_role}</span>
                    ${!m.is_read ? '<span class="pill pill-blue" style="font-size:11px;">New</span>' : ''}
                </div>
                <div class="msg-subject">${m.subject}</div>
                <div class="msg-preview">${m.body}</div>
            </div>
            <div class="msg-meta">${formatDate(m.created_at)}</div>
        </div>`).join('');
}

function renderSent(data) {
    const el = document.getElementById('sent-list');
    if (!data.length) {
        el.innerHTML = '<div class="empty-state"><div class="empty-icon">📤</div><h3>No sent messages</h3></div>';
        return;
    }
    el.innerHTML = data.map(m => `
        <div class="msg-row" onclick="readMessage(${m.id}, '${escHtml(m.subject)}', 'To: ${escHtml(m.receiver_name)}', '${escHtml(m.body)}', '${m.created_at}', null, true)">
            <div class="msg-avatar" style="background:linear-gradient(135deg,#10b981,#06b6d4);">${m.receiver_name[0].toUpperCase()}</div>
            <div style="flex:1;min-width:0;">
                <div style="display:flex;align-items:center;gap:8px;">
                    <span style="font-weight:600;font-size:14px;">To: ${m.receiver_name}</span>
                    <span class="pill pill-gray" style="font-size:11px;">${m.receiver_role}</span>
                </div>
                <div class="msg-subject">${m.subject}</div>
                <div class="msg-preview">${m.body}</div>
            </div>
            <div class="msg-meta">${formatDate(m.created_at)}</div>
        </div>`).join('');
}

function readMessage(id, subject, from, body, date, senderId, isRead) {
    currentMsgId = id;
    currentSenderId = senderId;
    document.getElementById('read-subject').textContent = subject;
    document.getElementById('read-from').textContent = from;
    document.getElementById('read-avatar').textContent = from[0].toUpperCase();
    document.getElementById('read-body').textContent = body;
    document.getElementById('read-date').textContent = new Date(date).toLocaleString();
    document.getElementById('reply-btn').style.display = senderId ? 'inline-flex' : 'none';
    document.getElementById('read-modal').classList.add('open');
    if (!isRead && senderId) {
        fetch(`${API}/messages/${id}/read`, {method: 'PUT', headers: authHeaders()})
            .then(() => loadMessages());
    }
}

function closeRead() { document.getElementById('read-modal').classList.remove('open'); }

function replyTo() {
    closeRead();
    openCompose(currentSenderId);
}

async function deleteCurrentMsg() {
    if (!confirm('Delete this message?')) return;
    await fetch(`${API}/messages/${currentMsgId}`, {method: 'DELETE', headers: authHeaders()});
    closeRead();
    loadMessages();
    showToast('Message deleted', 'success');
}

function openCompose(toId = null) {
    document.getElementById('msg-to').value = toId || '';
    document.getElementById('msg-subject').value = '';
    document.getElementById('msg-body').value = '';
    document.getElementById('compose-modal').classList.add('open');
}

function closeCompose() { document.getElementById('compose-modal').classList.remove('open'); }

async function sendMessage() {
    const data = {
        sender_id: currentUser.id,
        receiver_id: document.getElementById('msg-to').value,
        subject: document.getElementById('msg-subject').value.trim(),
        body: document.getElementById('msg-body').value.trim(),
    };
    if (!data.receiver_id || !data.subject || !data.body) {
        showToast('Please fill all fields', 'error'); return;
    }
    try {
        await fetch(`${API}/messages`, {method: 'POST', headers: authHeaders(), body: JSON.stringify(data)});
        closeCompose();
        loadMessages();
        showToast('Message sent successfully', 'success');
    } catch (e) { showToast('Failed to send message', 'error'); }
}

function switchTab(name, btn) {
    document.querySelectorAll('.msg-tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.msg-tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`tab-${name}`).classList.add('active');
    if (btn) btn.classList.add('active');
}

function formatDate(d) {
    const date = new Date(d);
    const now = new Date();
    if (date.toDateString() === now.toDateString()) {
        return date.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    }
    return date.toLocaleDateString();
}

function escHtml(str) {
    return String(str).replace(/'/g, "\\'").replace(/\n/g, ' ');
}

function showToast(msg, type = 'success') {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> ${msg}`;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3500);
}

document.getElementById('compose-modal').addEventListener('click', e => { if (e.target === document.getElementById('compose-modal')) closeCompose(); });
document.getElementById('read-modal').addEventListener('click', e => { if (e.target === document.getElementById('read-modal')) closeRead(); });

function logout() { localStorage.removeItem('cwms_token'); localStorage.removeItem('cwms_user'); }

init();
</script>
</body>
</html>
