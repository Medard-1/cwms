version: '3.9'

services:

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: cwms_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: cwms
    volumes:
      - cwms_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/users.sql:/docker-entrypoint-initdb.d/02_users.sql
      - ./database/migrate_cases.sql:/docker-entrypoint-initdb.d/03_migrate_cases.sql
      - ./database/migrate_comms.sql:/docker-entrypoint-initdb.d/04_migrate_comms.sql
      - ./database/seed_users.sql:/docker-entrypoint-initdb.d/05_seed_users.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js App
  app:
    build: .
    container_name: cwms_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: postgres
      DB_PASS: admin
      DB_NAME: cwms
      DB_PORT: 5432
      JWT_SECRET: cwms_super_secret_key_2024
    depends_on:
      db:
        condition: service_healthy

volumes:
  cwms_pgdata:
